apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: trackapplyeasy-ingress
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: trackapplyeasy } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { app.kubernetes.io/name: traefik, app.kubernetes.io/instance: traefik-kube-system } }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: vvivid-rd } }
          podSelector: { matchLabels: { app.kubernetes.io/name: rd-gateway } }
      ports: [ { protocol: TCP, port: 8090 } ]

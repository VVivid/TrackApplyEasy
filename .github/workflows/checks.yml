name: Checks
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.9'
          cache-dependency-path: go.sum
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install pinned tools and dependencies
        run: |
          sh scripts/install-ci-tools.sh
          npm ci --prefix web --no-fund --no-audit
          PLAYWRIGHT_BROWSERS_PATH="$PWD/.cache/playwright" npm --prefix web exec -- playwright install --with-deps chromium
      - name: Validate application, SQLite, OIDC, MCP, chart and release contracts
        run: |
          make check test race build chart-test browser-test
          python3 -m unittest discover -s deploy/gitops -p 'test_*.py'
      - name: Build production image
        run: |
          docker build --platform linux/amd64 --tag trackapplyeasy:check .
          TEST_IMAGE=trackapplyeasy:check make container-test
